{% extends "base.html" %}
{% block title %}Reports — Server Monitor{% endblock %}

{% block content %}
<div class="mb-4">
  <h1 class="h3 mb-1">Reports</h1>
  <p class="text-muted mb-0">Export monitoring data as CSV or PDF summaries</p>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <label class="form-label">Report period (hours)</label>
    <select id="reportHours" class="form-select">
      <option value="6">6 hours</option>
      <option value="24" selected>24 hours</option>
      <option value="72">72 hours</option>
      <option value="168">7 days</option>
    </select>
  </div>
  <div class="col-md-8 d-flex align-items-end gap-2 flex-wrap">
    <a href="#" class="btn btn-success" id="exportCsv" title="Requires admin login"><i class="bi bi-filetype-csv"></i> Download CSV</a>
    <a href="#" class="btn btn-danger" id="exportPdf" title="Requires admin login"><i class="bi bi-filetype-pdf"></i> Download PDF</a>
    <button type="button" class="btn btn-outline-primary" id="refreshSummary"><i class="bi bi-arrow-clockwise"></i> Refresh summary</button>
  </div>
</div>

<div id="reportSummary" class="row g-3">
  <div class="col-12 text-center text-muted py-5">Loading summary…</div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  function hours() {
    return document.getElementById('reportHours').value;
  }

  document.getElementById('exportCsv').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = '/api/reports/csv?hours=' + hours();
  });
  document.getElementById('exportPdf').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = '/api/reports/pdf?hours=' + hours();
  });

  async function loadSummary() {
    const el = document.getElementById('reportSummary');
    el.innerHTML = '<div class="col-12 text-center text-muted py-4">Loading…</div>';
    try {
      const res = await fetch('/api/reports/summary?hours=' + hours());
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Failed');
      const d = json.data;
      const m = d.metrics || {};
      const a = d.alerts || {};
      const an = d.anomalies || {};
      el.innerHTML = `
        <div class="col-md-3"><div class="card h-100"><div class="card-body">
          <h6 class="text-muted">Metrics</h6>
          <p class="mb-1">Records: <strong>${m.total_records || 0}</strong></p>
          <p class="mb-1">Avg CPU: <strong>${m.cpu?.avg ?? '—'}%</strong></p>
          <p class="mb-0">Health avg: <strong>${m.health_avg ?? '—'}</strong></p>
        </div></div></div>
        <div class="col-md-3"><div class="card h-100"><div class="card-body">
          <h6 class="text-muted">Alerts</h6>
          <p class="mb-1">Total: <strong>${a.total || 0}</strong></p>
          <p class="mb-1">Critical: <strong>${a.by_severity?.critical || 0}</strong></p>
          <p class="mb-0">Active: <strong>${a.by_status?.active || 0}</strong></p>
        </div></div></div>
        <div class="col-md-3"><div class="card h-100"><div class="card-body">
          <h6 class="text-muted">Anomalies</h6>
          <p class="mb-1">Analyzed: <strong>${an.total_analyzed || 0}</strong></p>
          <p class="mb-1">Detected: <strong>${an.total_anomalies || 0}</strong></p>
          <p class="mb-0">Rate: <strong>${an.anomaly_rate ?? 0}%</strong></p>
        </div></div></div>
        <div class="col-md-3"><div class="card h-100"><div class="card-body">
          <h6 class="text-muted">Logs</h6>
          <p class="mb-1">Total events: <strong>${d.logs?.total || 0}</strong></p>
          <p class="mb-0 small text-muted">Generated: ${new Date(d.generated_at).toLocaleString()}</p>
        </div></div></div>
      `;
    } catch (err) {
      el.innerHTML = '<div class="col-12 alert alert-danger">' + err.message + '</div>';
    }
  }

  document.getElementById('refreshSummary').addEventListener('click', loadSummary);
  document.getElementById('reportHours').addEventListener('change', loadSummary);
  loadSummary();
})();
</script>
{% endblock %}
